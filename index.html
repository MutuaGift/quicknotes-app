<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes | Note-taking app</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Capture ideas fast, keep them organised.</p>
  </header>

  <main>
    <section id="add-note">
      <h2>Add a note</h2>

      <form id="note-form">
        <div class="field">
          <label for="note-input">Your note</label>
          <input type="text" id="note-input" placeholder="e.g. Buy milk and bread" autocomplete="off">
        </div>

        <div class="field">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Note</button>
      </form>

      <p id="error-message" role="alert"></p>
    </section>

    <section id="your-notes">
      <h2>Your notes</h2>

      <div class="search">
        <label for="search-input">Search notes</label>
        <input type="search" id="search-input" placeholder="Type to search your notes..." autocomplete="off">
      </div>

      <p id="note-count"></p>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built as part of the Web Foundations course.</p>
  </footer>

</body>
</html>
